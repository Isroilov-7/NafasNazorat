# /etc/nginx/sites-available/nafasnazorat  (symlink into sites-enabled)
# Separate server block — the existing plagiatx.uz config is not touched.
# Replace nafasnazorat.uz with the real domain; TLS via: certbot --nginx -d nafasnazorat.uz -d www.nafasnazorat.uz

limit_req_zone $binary_remote_addr zone=nafas_req:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=nafas_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name nafasnazorat.uz www.nafasnazorat.uz;

    client_max_body_size 1m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /login {
        limit_req zone=nafas_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/nafas-proxy.conf;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/nafas-proxy.conf;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_req zone=nafas_req burst=40 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/nafas-proxy.conf;
    }
}
